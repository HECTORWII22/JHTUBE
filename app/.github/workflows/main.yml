name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate debug.keystore and dummy google-services.json
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          cp debug.keystore app/debug.keystore || true
          
          if [ ! -f "app/google-services.json" ]; then
            echo '{
              "project_info": {
                "project_number": "1234567890",
                "project_id": "jhtube-ci-dummy",
                "storage_bucket": "jhtube-ci-dummy.appspot.com"
              },
              "client": [{
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.example"
                  }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "AIzaSyDummyKeyForCICompilationOnly12345" }],
                "services": {
                  "analytics_service": { "status": 1 },
                  "appinvite_service": { "status": 1, "other_platform_oauth_client": [] },
                  "ads_service": { "status": 2 }
                }
              }],
              "configuration_version": "1"
            }' > app/google-services.json
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK with Gradle
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
